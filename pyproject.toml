[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
# Use spaces for indentation (matching VS Code settings)
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.format]
# Use spaces for indentation (matching VS Code settings)
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
# Enable common Python linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
]
# Whitespace warnings stay ignored; Ruff formatter normalizes to spaces on save
ignore = [
    "W191",  # indentation contains tabs
    "E101",  # indentation contains mixed spaces and tabs
    "E111",  # indentation is not a multiple of four
    "E114",  # indentation is not a multiple of four (comment)
    "E117",  # over-indented
    "W293",  # blank line contains whitespace
    "W291",  # trailing whitespace
    "W391",  # too many blank lines at end of file/cell
    "E501",  # line too long
    "E502",  # backslash in the middle of nowhere
]

[tool.ruff.lint.isort]
# Configure import sorting
combine-as-imports = true
force-wrap-aliases = true
