<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Science Roadmap to Mastery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gray-matter@4.0.3/dist/gray-matter.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-64 bg-gray-800 text-white p-6 fixed h-full overflow-y-auto transition-transform transform -translate-x-full md:translate-x-0 z-30">
      <h1 class="text-2xl font-bold mb-6 border-b border-gray-600 pb-4">DS Roadmap</h1>
      <nav id="week-navigation" class="space-y-2" aria-label="Roadmap weeks"></nav>
    </aside>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden opacity-0 md:hidden sidebar-overlay" role="presentation"></div>

    <main class="flex-1 md:ml-64 p-4 sm:p-6 lg:p-8">
      <button id="menu-toggle" class="md:hidden mb-4 p-2 rounded-md bg-gray-800 text-white fixed top-4 left-4 z-40" aria-label="Toggle roadmap navigation">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="content-area" class="space-y-12" role="region" aria-live="polite">
        <div class="text-center text-gray-500">Loading roadmap...</div>
      </div>
    </main>
  </div>
</body>
</html>
